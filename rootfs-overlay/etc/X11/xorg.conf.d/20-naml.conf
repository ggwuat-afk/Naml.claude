# NAML — Xorg على /dev/fb0 (vesafb أو simpledrm)، 800x600x16
# ShadowFB ضروري عملياً: يرسم في RAM ثم ينسخ إطاراً واحداً، فيصير التمرير
# مقبولاً على VGA بلا تسريع.

Section "Device"
    Identifier  "naml-fb0"
    Driver      "fbdev"
    Option      "fbdev"     "/dev/fb0"
    Option      "ShadowFB"  "true"
EndSection

Section "Monitor"
    Identifier  "naml-mon"
    HorizSync   30-50
    VertRefresh 56-75
EndSection

Section "Screen"
    Identifier  "naml-screen"
    Device      "naml-fb0"
    Monitor     "naml-mon"
    DefaultDepth 16
    SubSection "Display"
        Depth   16
        Modes   "800x600"
    EndSubSection
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "BlankTime"      "0"
    Option "StandbyTime"    "0"
    Option "SuspendTime"    "0"
    Option "OffTime"        "0"
EndSection
