# /etc/naml/init.conf — أسطر KEY=value فقط · لا أوامر · لا تعليقات نهاية السطر
NAML_TTY=tty1
NAML_TERM=linux
NAML_SHELL=/usr/bin/naml-shell
NAML_HOSTNAME=naml
NAML_TMP_SIZE=16M
NAML_RUN_SIZE=4M
NAML_SHM_SIZE=8M
NAML_RESPAWN_MIN=3
NAML_RESPAWN_MAX=30
NAML_FAIL_LIMIT=5
NAML_VERBOSE=0
NAML_TUNE=1
NAML_OOM_GUARD=1
NAML_NET_LO=1
